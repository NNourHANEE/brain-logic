name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build fat JAR
        run: mvn package -DskipTests --no-transfer-progress

      - name: Verify JAR is executable
        run: |
          JAR=target/jeu-reflexion-jee-1.0.0.jar
          echo "JAR size: $(du -sh $JAR | cut -f1)"
          unzip -p $JAR META-INF/MANIFEST.MF | grep Main-Class

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: jeu-reflexion-jee
          path: target/jeu-reflexion-jee-1.0.0.jar
          retention-days: 7
