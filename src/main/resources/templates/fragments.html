<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  Hidden form posted by the in-page countdown when the time budget is exhausted.
  Server-side, /game/{id}/tick checks the elapsed time and finishes the game as lost.
-->
<form th:fragment="tickForm(game)"
      th:if="${!game.completed}"
      th:id="|tickForm-${game.id}|"
      th:action="@{/game/{id}/tick(id=${game.id})}"
      method="post"
      style="display:none"></form>

<!--
  Bravo overlay shown in-game right after a winning move. The "Voir les résultats"
  button takes the player to the result page (a plain GET on /game/{id}, no flag).
-->
<div th:fragment="bravoPopup(game, stars)"
     th:if="${celebrate}"
     class="popup bravo-popup"
     id="bravoPopup"
     data-popup
     data-auto-open="celebrate"
     aria-hidden="true">
  <div class="bravo-card">
    <p class="bravo-word">Bravo&nbsp;!</p>
    <p class="bravo-sub">Félicitations <span th:text="${game.playerName}">Joueur</span>, défi accompli&nbsp;🎉</p>
    <div class="bravo-stars" aria-label="Évaluation">
      <span th:text="${stars >= 1 ? '★' : '☆'}">★</span>
      <span th:text="${stars >= 2 ? '★' : '☆'}">★</span>
      <span th:text="${stars >= 3 ? '★' : '☆'}">★</span>
    </div>
    <p class="bravo-score"><span th:text="${game.score}">0</span> points</p>
    <a class="bravo-close" data-sound="tap" th:href="@{/game/{id}(id=${game.id})}">Voir les résultats →</a>
  </div>
</div>

<!--
  Dommage overlay shown in-game when the time budget runs out (game is lost).
-->
<div th:fragment="dommagePopup(game)"
     th:if="${dommage}"
     class="popup dommage-popup"
     id="dommagePopup"
     data-popup
     data-auto-open="dommage"
     aria-hidden="true">
  <div class="dommage-card">
    <p class="dommage-word">Dommage&nbsp;!</p>
    <p class="dommage-sub">Le temps est écoulé, <span th:text="${game.playerName}">Joueur</span>.</p>
    <p class="dommage-tag">Game Over</p>
    <p class="dommage-progress">
      Progression&nbsp;: <strong th:text="${game.matchedPairs + ' / ' + game.totalPairs}">0/4</strong>
    </p>
    <a class="dommage-close" data-sound="tap" th:href="@{/game/{id}(id=${game.id})}">Voir les résultats →</a>
  </div>
</div>

</body>
</html>
