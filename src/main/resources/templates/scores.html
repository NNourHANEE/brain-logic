<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scores</title>
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="page">
  <header class="list-header">
    <a class="text-link" th:href="@{/}">Accueil</a>
    <h1>Classement</h1>
  </header>

  <section class="empty card-panel" th:if="${scores.isEmpty()}">
    <h2>Aucun score enregistré</h2>
    <p>Terminez une partie pour apparaître dans le classement.</p>
  </section>

  <ol class="score-list" th:if="${!scores.isEmpty()}">
    <li class="card-panel" th:each="score, iter : ${scores}">
      <span class="rank" th:text="${'#' + (iter.index + 1)}">#1</span>
      <div>
        <strong th:text="${score.playerName}">Joueur</strong>
        <small th:text="${score.gameType.label + ' · ' + score.difficulty.label + ' · ' + score.moves + ' coups'}">Niveau</small>
      </div>
      <b th:text="${score.score}">0</b>
    </li>
  </ol>
</main>
</body>
</html>
