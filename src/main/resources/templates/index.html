<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Logic</title>
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <script defer th:src="@{/js/effects.js}"></script>
</head>
<body class="home-body">
<main class="home-page calm-home">
  <section class="play-card">
    <div class="course-tag">M1 ISII · JEE</div>

    <div class="card-stack compact-stack" aria-hidden="true">
      <span class="visual-card visual-card-one"><img th:src="@{/images/star.svg}" alt=""></span>
      <span class="visual-card visual-card-two"><img th:src="@{/images/card-back.svg}" alt=""></span>
      <span class="visual-card visual-card-three"><img th:src="@{/images/rainbow.svg}" alt=""></span>
    </div>

    <h1>Brain Logic</h1>
    <p class="home-line">Choisissez un jeu et un niveau.</p>

    <form class="start-form" th:action="@{/start}" method="post">
      <input id="playerName" name="playerName" type="text" maxlength="80" placeholder="Nom du joueur" required aria-label="Nom du joueur">

      <div class="selection-preview compact-preview" aria-live="polite">
        <strong data-selection-title>Mémoire · Facile</strong>
        <small data-selection-description>Prêt à jouer</small>
      </div>

      <div class="popup-launchers">
        <button class="popup-launcher game-launcher" type="button" data-open-popup="game-popup" data-sound="tap">
          <span>Jeu</span>
          <strong data-game-choice-label>Mémoire</strong>
        </button>
        <button class="popup-launcher level-launcher" type="button" data-open-popup="level-popup" data-sound="tap">
          <span>Niveau</span>
          <strong data-level-choice-label>Facile</strong>
        </button>
      </div>

      <button class="primary-button start-button" type="submit" data-sound="tap">Commencer</button>

      <div class="choice-popup" id="game-popup" data-popup aria-hidden="true">
        <div class="popup-card game-popup-card">
          <button class="popup-close" type="button" data-close-popup data-sound="tap">×</button>
          <span class="popup-badge">Choisis ton jeu</span>
          <h2>À quoi tu veux jouer ?</h2>
          <div class="game-types popup-options" aria-label="Choisir un jeu">
            <label th:each="gameType, iter : ${gameTypes}" class="game-type-option compact-option" th:data-game-card="${gameType.name()}" th:data-game-title="${gameType.label}" th:data-game-description="${gameType.description}">
              <input type="radio" name="gameType" th:value="${gameType.name()}" th:checked="${iter.index == 0}">
              <span>
                <b class="game-token" th:text="${iter.index + 1}">1</b>
                <strong th:text="${gameType.label}">Mémoire</strong>
                <small th:text="${gameType.description}">Description</small>
              </span>
            </label>
          </div>
        </div>
      </div>

      <div class="choice-popup" id="level-popup" data-popup aria-hidden="true">
        <div class="popup-card level-popup-card">
          <button class="popup-close" type="button" data-close-popup data-sound="tap">×</button>
          <span class="popup-badge">Choisis ton niveau</span>
          <h2>Quelle difficulté ?</h2>
          <div class="levels clean-levels popup-options" aria-label="Choisir un niveau">
            <label th:each="difficulty, iter : ${difficulties}" class="level-option" th:data-level-card="${difficulty.name()}" th:data-level-title="${difficulty.label}" th:data-level-description="${'Niveau ' + (iter.index + 1)}">
              <input type="radio" name="difficulty" th:value="${difficulty.name()}" th:checked="${iter.index == 0}">
              <span>
                <strong th:text="${difficulty.label}">Facile</strong>
                <small th:text="${'Niveau ' + (iter.index + 1)}">Niveau</small>
              </span>
            </label>
          </div>
        </div>
      </div>
    </form>

    <nav class="home-actions">
      <a th:href="@{/saved}" data-sound="tap">Reprendre</a>
      <a th:href="@{/scores}" data-sound="tap">Classement</a>
    </nav>
  </section>

</main>
</body>
</html>
