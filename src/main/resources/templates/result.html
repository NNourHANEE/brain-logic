<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${game.lost} ? 'Dommage' : 'Résultat'">Résultat</title>
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <script defer th:src="@{/js/effects.js}"></script>
</head>
<body data-page="result"
      th:data-game-state="${game.lost} ? 'lost' : 'won'">
<div class="confetti" aria-hidden="true" th:if="${!game.lost}">
  <span></span><span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span><span></span>
  <span></span><span></span><span></span><span></span><span></span><span></span>
</div>
<main class="page result-page">
  <section class="card-panel result-card" th:classappend="${game.lost} ? ' result-lost' : ' result-won'">
    <p class="eyebrow" th:text="${game.lost} ? 'Temps écoulé' : 'Partie terminée'">Partie terminée</p>
    <h1 th:if="${!game.lost}">Bravo <span th:text="${game.playerName}">Joueur</span></h1>
    <h1 th:if="${game.lost}">Dommage <span th:text="${game.playerName}">Joueur</span></h1>
    <p class="subtitle" th:text="${game.gameType.label + ' · Niveau ' + game.difficulty.label}">Jeu</p>
    <div class="stars" aria-label="Évaluation" th:if="${!game.lost}">
      <span th:text="${stars >= 1 ? '★' : '☆'}">★</span>
      <span th:text="${stars >= 2 ? '★' : '☆'}">★</span>
      <span th:text="${stars >= 3 ? '★' : '☆'}">★</span>
    </div>
    <p class="game-over-mark" th:if="${game.lost}" aria-hidden="true">⏱</p>
    <p class="score-number" th:text="${game.lost} ? 'Game Over' : ${game.score}">0</p>
    <p class="subtitle" th:text="${game.lost} ? 'Aucun point — réessayez !' : 'Score final'">Score final</p>

    <div class="stats inline">
      <div><span>Niveau</span><strong th:text="${game.difficulty.label}">Facile</strong></div>
      <div><span>Coups</span><strong th:text="${game.moves}">0</strong></div>
      <div><span>Temps</span><strong th:text="${game.elapsedLabel}">00:00</strong></div>
      <div><span th:text="${game.gameType.unitLabel}">Paires</span>
        <strong th:text="${game.matchedPairs + '/' + game.totalPairs}">0/4</strong>
      </div>
    </div>

    <div th:if="${!game.lost and stars >= 3 and game.difficulty.next() != null}" class="next-level-suggest">
      <p class="next-level-title">Excellent ! Prêt pour le défi suivant ?</p>
      <form th:action="@{/start}" method="post">
        <input type="hidden" name="playerName" th:value="${game.playerName}">
        <input type="hidden" name="gameType" th:value="${game.gameType}">
        <input type="hidden" name="difficulty" th:value="${game.difficulty.next()}">
        <button class="primary-button" type="submit" data-sound="tap">
          Essayer le niveau <span th:text="${game.difficulty.next().label}">Moyen</span> →
        </button>
      </form>
    </div>

    <div th:if="${game.lost}" class="next-level-suggest">
      <p class="next-level-title">Le temps vous a manqué cette fois.</p>
      <form th:action="@{/start}" method="post">
        <input type="hidden" name="playerName" th:value="${game.playerName}">
        <input type="hidden" name="gameType" th:value="${game.gameType}">
        <input type="hidden" name="difficulty" th:value="${game.difficulty}">
        <button class="primary-button" type="submit" data-sound="tap">Recommencer la partie</button>
      </form>
    </div>

    <div class="actions">
      <a class="primary-button" data-sound="tap" th:href="@{/}">Nouvelle partie</a>
      <a class="secondary-button" data-sound="tap" th:href="@{/scores}">Classement</a>
    </div>
  </section>
</main>
</body>
</html>
